# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_version = 1.1.3
maven_group = com.nbp.cobblemon_smartphone
archives_name = cobblemon_smartphone
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.1

# Dependencies
fabric_loader_version = 0.17.3
fabric_api_version = 0.116.7+1.21.1
neoforge_version = 21.1.214

kotlinforforge_version = 5.10.0
fabric_kotlin_version = 1.13.7+kotlin.2.2.21
cobblemon_version = 1.7.0+1.21.1

# Optional Dependencies
# Simple Voice Chat: we compile against the loader-agnostic API only (never bundled). Players get
# the actual mod from their modpack, and the Social app degrades gracefully without it. To test
# voice in dev, download the SVC jar (Modrinth, 2.6.20 for MC 1.21.1) into <loader>/run/mods —
# it is not auto-pulled because its published jar is built with a newer Loom than this project.
voicechat_api_version = 2.6.20
trinkets_version = 3.10.0
curios_version = 9.2.2+1.21.1
accessories_version = 1.1.0-beta.53+1.21.1
toms_storage_version = 1.21-2.4.1
# Refined Storage 2 publishes the same human version_number ("2.0.9") for both its Fabric and
# NeoForge builds on Modrinth, which makes that string ambiguous as a Modrinth-maven coordinate
# (it resolves to whichever build Modrinth's proxy happens to treat as "latest"). These are the
# per-loader Modrinth *version id* hashes instead, which are unambiguous.
refinedstorage_fabric_version = PMoDGaFz
refinedstorage_neoforge_version = lHHiI26k
# Refined Storage's own fabric.mod.json hard-requires (not just jar-in-jars) cloth-config2 and
# team_reborn_energy on Fabric - Fabric Loader refuses to launch without them present as actual
# mods in the dev run, even though our own code never touches either API directly.
cloth_config_version = 15.0.127
teamreborn_energy_version = 4.1.0
# AE2 has no Fabric build for 1.21.1 (NeoForge only), so there's no loader ambiguity here -
# the plain version number is a safe, unambiguous Modrinth-maven coordinate.
ae2_version = 19.2.17
